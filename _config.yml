# BMFORGE_COMPONENT: bmforge.github-pages; spec_version: 0.1.0
# Shared presentation lives in the remote theme.
remote_theme: "NadimGhaznavi/minimal-mistakes"
minimal_mistakes_skin: "dark"

title: "DevLog"
title_separator: "-"
name: "DevLog"
description: "Track time spent working in GitHub repositories, from the command line to daily reports."
locale: "en-US"
url: "https://nadimghaznavi.github.io"
baseurl: "/devlog"
repository: "NadimGhaznavi/devlog"
logo: "/pages/images/devlog.png"

mycount:
  endpoint: "https://count.osoyalce.com/count"
  site: "devlog"
multilingual:
  enabled: true
  default_lang: en

author:
  name: "Nadim-Daniel Ghaznavi"
  bio: "Creator"
  location: ""
  email: ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/NadimGhaznavi"
footer:
  since: "2026"

include:
  - pages
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - scripts
  - tests
  - templates
  - components
  - skills
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - pyproject.toml
  - package.json
  - package-lock.json
  - .agents
  - .aws
  - .codex
  - .git
  - .pytest_cache
  - build
  - conf
  - devlog
  - devlog.egg-info
  - docs
  - systemd
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6
sass:
  style: compressed
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      classes: wide
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
      author_profile: true
      read_time: false
      share: true
      related: true
