<!doctype html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t(text.APP_TITLE) }} · {% block page_title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="masthead">
    <a class="brand" href="{{ link('/') }}">{{ t(text.APP_TITLE) }} <span>{{ t(text.REPORTS) }}</span></a>
    <div class="masthead-details">
      <nav aria-label="{{ t(text.MAIN_NAVIGATION) }}">
        <a href="{{ link('/') }}"{% if active_page == 'report' %} aria-current="page"{% endif %}>{{ t(text.DAILY_HOURS) }}</a>
        <a href="{{ link('/tasks') }}"{% if active_page == 'tasks' %} aria-current="page"{% endif %}>{{ t(text.TASKS) }}</a>
      </nav>
      <span class="version">{{ t(text.APP_VERSION, version=version) }}</span>
    </div>
  </header>
  <main>
    <p class="note introduction">{{ t(text.APP_SUBTITLE) }}</p>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
